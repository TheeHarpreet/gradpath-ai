[project]
name = "gradpath-api"
version = "0.1.0"
description = "GradPath AI application API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.140.7",
    "langgraph>=1.2.9",
    "numpy>=2.4.3",
    "openai>=2.24.0",
    "openai-agents>=0.8.1",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
gradpath-api = "gradpath_api.main:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
