[project]
name = "gradpath-mcp"
version = "0.1.0"
description = "GradPath AI MCP adapter"
requires-python = ">=3.13"
dependencies = [
    "gradpath-api",
    "mcp>=1.28.1",
]

[tool.uv.sources]
gradpath-api = { workspace = true }

[project.scripts]
gradpath-mcp = "gradpath_mcp:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
