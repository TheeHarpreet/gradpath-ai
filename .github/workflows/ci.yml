name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: gradpath
          POSTGRES_USER: gradpath
          POSTGRES_PASSWORD: gradpath_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradpath -d gradpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRADPATH_DATABASE_URL: postgresql+psycopg://gradpath:gradpath_dev@localhost:5432/gradpath
      GRADPATH_RUN_POSTGRES_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.32

      - name: Synchronise locked dependencies
        run: python -m uv sync --locked --all-packages --dev

      - name: Check formatting
        run: python -m uv run ruff format --check .

      - name: Lint
        run: python -m uv run ruff check .

      - name: Type check
        run: python -m uv run mypy

      - name: Apply database migrations
        run: python -m uv run alembic upgrade head

      - name: Test
        run: python -m uv run pytest

  web:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  containers:
    name: Production containers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build --file apps/api/Dockerfile --tag gradpath-api:ci .
          docker build --file apps/web/Dockerfile --tag gradpath-web:ci .

      - name: Smoke-test API image
        run: |
          docker run --detach --name gradpath-api --publish 18080:8080 gradpath-api:ci
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18080/health/live && exit 0
            sleep 1
          done
          docker logs gradpath-api
          exit 1

      - name: Smoke-test web image
        run: |
          docker run --detach --name gradpath-web --publish 18081:8080 gradpath-web:ci
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18081/health && exit 0
            sleep 1
          done
          docker logs gradpath-web
          exit 1

      - name: Scan images for critical vulnerabilities
        run: |
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --exit-code 1 --ignore-unfixed --severity CRITICAL gradpath-api:ci
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --exit-code 1 --ignore-unfixed --severity CRITICAL gradpath-web:ci
