[project]
name = "gradpath-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/mcp-server",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/mcp-server/tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["postgres: requires the migrated PostgreSQL/pgvector service"]

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
show_error_codes = true
packages = ["gradpath_api", "gradpath_mcp"]
mypy_path = ["apps/api/src", "apps/mcp-server/src"]
