repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check .
        language: system
        pass_filenames: false

      - id: ruff-check
        name: Ruff lint
        entry: ruff check .
        language: system
        pass_filenames: false

      - id: python-tests
        name: Python tests
        entry: pytest
        language: system
        pass_filenames: false

      - id: mypy
        name: Python type check
        entry: mypy
        language: system
        pass_filenames: false

      - id: web-checks
        name: Frontend format, lint, tests and build
        entry: npm --prefix apps/web run check
        language: system
        pass_filenames: false
